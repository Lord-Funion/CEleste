name: Apply climb chest update

on:
  push:
    branches: [agent/climb-chest-title-hint]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/climb-chest-title-hint
      - name: Apply guarded source changes
        run: python3 tools/apply_climb_chest_update.py
      - name: Commit source changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/classic.h src/classic.cpp tools/calculator-editor/src/main.cpp docs/custom-level-format.md README.md
          git commit -m "Add Climb Chest and title custom-level hint"
          git push origin HEAD:agent/climb-chest-title-hint
