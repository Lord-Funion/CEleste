name: Apply per-source fruit persistence

on:
  push:
    branches: [agent/per-source-fruit-state]
    paths:
      - .github/per-source-fruit.patch
      - .github/workflows/apply-per-source-fruit.yml
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/per-source-fruit-state
      - name: Apply source persistence patch
        run: |
          # The staged patch intentionally ends after six old/new lines in its
          # final hunk; normalize that hunk count before applying.
          sed -i 's/@@ -1452,7 +1468,7 @@/@@ -1452,6 +1468,6 @@/' .github/per-source-fruit.patch
          git apply --check .github/per-source-fruit.patch
          git apply .github/per-source-fruit.patch
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "Lord-Funion Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/custom_levels.h src/custom_levels.cpp src/classic.h src/classic.cpp
          git commit -m "Track custom strawberries by source"
          git push origin HEAD:agent/per-source-fruit-state
