name: Apply rotation v2 patch

on:
  push:
    branches: [agent/arbitrary-rotation-v2]
    paths:
      - patches/apply_rotation_v2.py
      - .github/workflows/apply-rotation-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arbitrary-rotation-v2
      - name: Apply source patch
        run: python3 patches/apply_rotation_v2.py
      - name: Commit generated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git add src/emu.cpp src/classic.cpp src/classic.h tools/calculator-editor/src/main.cpp
          git commit -m "Implement arbitrary quarter-turn rendering"
          git push origin HEAD:agent/arbitrary-rotation-v2
