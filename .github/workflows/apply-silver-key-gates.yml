name: Apply silver key gates

on:
  push:
    branches:
      - agent/silver-key-gates

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/silver-key-gates
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH=tools/patches/silver-key-gates.patch
          if [ ! -f "$PATCH" ]; then
            echo "Patch already cleaned up."
            exit 0
          fi
          if git apply --check "$PATCH"; then
            git apply "$PATCH"
          else
            echo "Patch is already applied or no longer applies; checking for feature marker."
            grep -q 'SILVER_GATE = 131' src/classic.h || exit 1
          fi

          # spr_rot takes rotation plus optional flip_x/flip_y; keep the animated key flip.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/classic.cpp')
          s = p.read_text()
          s = s.replace('spr_rot(sprite, x, y, custom_rotation, 1, 1, flip.x, flip.y);',
                        'spr_rot(sprite, x, y, custom_rotation, flip.x, flip.y);')
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/classic.h src/classic.cpp src/custom_levels.h src/custom_levels.cpp tools/calculator-editor/src/main.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add linked silver keys and gate blocks [silver-patch-applied]"
          git push origin HEAD:agent/silver-key-gates
