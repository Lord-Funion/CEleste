name: Apply silver key gates

on:
  push:
    branches:
      - agent/silver-key-gates
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/silver-key-gates
          fetch-depth: 0
      - name: Apply guarded source changes
        run: python3 tools/apply_silver_key_gates.py
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/classic.h src/classic.cpp src/custom_levels.h src/custom_levels.cpp tools/calculator-editor/src/main.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add linked silver keys and gate blocks [silver-patch-applied]"
          git push origin HEAD:agent/silver-key-gates
