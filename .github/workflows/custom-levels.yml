name: Custom level integration

on:
  push:
    branches: [agent/custom-level-editor]
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded runtime hooks
        run: python3 patches/apply_runtime_integration.py
      - name: Compile portable parser
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc -c src/clevel_format.cpp -o /tmp/clevel_format.o
      - name: Commit integration hooks
        if: github.event_name == 'push' && github.ref_name == 'agent/custom-level-editor'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/classic.cpp src/emu.cpp src/emu.h
          git commit -m "Integrate custom-level runtime"
          git push
      - name: Require committed hooks on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code
