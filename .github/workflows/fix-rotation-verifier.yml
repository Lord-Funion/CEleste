name: Fix rotation verifier
on:
  push:
    branches: [agent/arbitrary-rotation-v2]
    paths: [.github/workflows/fix-rotation-verifier.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/arbitrary-rotation-v2}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('patches/apply_runtime_integration.py')
          t=p.read_text()
          old='replace("src/classic.cpp", "    profiler_end(draw);\\n}\\n\\nvoid Object::draw() {\\n", "    custom_level_menu::draw();\\n    profiler_end(draw);\\nn}\\n\\nvoid Object::draw() {\\n")'
          # Match the actual current source spelling (without the accidental n variant above).
          actual='replace("src/classic.cpp", "    profiler_end(draw);\\n}\\n\\nvoid Object::draw() {\\n", "    custom_level_menu::draw();\\n    profiler_end(draw);\\n}\\n\\nvoid Object::draw() {\\n")'
          new='classic = (ROOT / "src/classic.cpp").read_text()\\nif "custom_level_menu::draw();" not in classic:\\n    replace("src/classic.cpp", "    profiler_end(draw);\\n}\\n\\nvoid Object::draw() {\\n", "    custom_level_menu::draw();\\n    profiler_end(draw);\\n}\\n\\nvoid Object::draw() {\\n")'
          if actual not in t: raise SystemExit('draw verifier marker missing')
          p.write_text(t.replace(actual,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add patches/apply_runtime_integration.py
          git commit -m "Accept already-integrated custom menu draw hook"
          git push origin HEAD:agent/arbitrary-rotation-v2
