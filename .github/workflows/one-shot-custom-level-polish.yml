name: One-shot custom level polish

on:
  push:
    paths:
      - '.github/workflows/one-shot-custom-level-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply polish
        run: python .github/scripts/apply_custom_level_polish.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tools/calculator-editor
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Polish custom level completion and CELEDIT UX"
            git push
          fi
