name: One-shot fix runtime guard

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-runtime-guard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_runtime_guard_for_results.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/apply_runtime_integration.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Allow custom completion timer guard in integration verifier"
            git push
          fi
