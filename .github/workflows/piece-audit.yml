name: Piece audit

on:
  push:
    branches: [agent/full-piece-editor-v2]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List every map tile used by the original cartridge
        run: |
          python3 - <<'PY'
          import re, collections, pathlib
          text = pathlib.Path('src/emu.cpp').read_text()
          m = re.search(r'const uint8_t tilemap\s*\[[^]]*\]\s*=\s*\{(.*?)\};', text, re.S)
          if not m:
              raise SystemExit('could not find embedded tilemap')
          vals = [int(x,16) for x in re.findall(r'0x([0-9a-fA-F]{1,2})', m.group(1))]
          c = collections.Counter(vals)
          print('UNIQUE_IDS=' + ','.join(map(str, sorted(c))))
          print('COUNT=' + str(len(c)))
          print('FREQUENCIES')
          for k in sorted(c): print(f'{k:3d} 0x{k:02x} {c[k]}')
          print('COMPOUND_NEIGHBORHOODS')
          targets={11,12,22,28,64,86,96,118}
          for idx,v in enumerate(vals):
              if v not in targets: continue
              gx,gy=idx%128,idx//128
              print(f'ID {v} global=({gx},{gy}) room=({gx//16},{gy//16}) local=({gx%16},{gy%16})')
              for yy in range(max(0,gy-2),min(64,gy+3)):
                  row=[]
                  for xx in range(max(0,gx-2),min(128,gx+3)):
                      row.append(f'{vals[yy*128+xx]:02x}')
                  print('  '+' '.join(row))
          PY
