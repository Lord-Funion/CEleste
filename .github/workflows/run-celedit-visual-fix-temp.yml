name: Temporary CELEDIT visual fix runner

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/celedit-visuals-releases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/celedit-visuals-releases
          fetch-depth: 0
      - name: Apply visual fixes
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/fix_celedit_visuals.py ]; then
            python3 tools/fix_celedit_visuals.py
          else
            echo "Visual fix helper already removed."
          fi
      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/calculator-editor/src/main.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix CELEDIT palette and text rendering"
          git push origin HEAD:fix/celedit-visuals-releases
