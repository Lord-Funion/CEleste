name: Source snapshot

on:
  push:
    branches: [agent/full-piece-editor-v2]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: CEleste-source-snapshot
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
