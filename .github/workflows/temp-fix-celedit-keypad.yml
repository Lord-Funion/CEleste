name: Temporary key sprite extraction

on:
  pull_request:
    branches:
      - master

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --user pillow
      - name: Extract original key frames
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          atlas = Image.open('src/gfx/atlas.png').convert('RGBA')
          out = Path('key-texture')
          out.mkdir(exist_ok=True)
          for sprite_id in (8, 9, 10):
              x = (sprite_id % 16) * 8
              y = (sprite_id // 16) * 8
              atlas.crop((x, y, x + 8, y + 8)).save(out / f'normal_key_sprite_{sprite_id}.png')
          strip = atlas.crop((64, 0, 88, 8))
          strip.save(out / 'normal_key_all_3_frames.png')
          strip.resize((576, 192), Image.Resampling.NEAREST).save(out / 'normal_key_all_3_frames_preview.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: normal-key-three-frames
          path: key-texture/*.png
          retention-days: 90
