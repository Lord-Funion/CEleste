name: Temporary silver key patch runner

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/silver-key-sprites
          fetch-depth: 0
      - name: Apply silver key sprites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          atlas_b64 = """"""
          Path("src/gfx/atlas.png").write_bytes(base64.b64decode(atlas_b64))

          classic = Path("src/classic.cpp")
          s = classic.read_text()
          old = """void SilverKey::draw() {
    // The silver key deliberately reuses the original animated chest-key art.
    pal(9, 6);
    pal(10, 7);
    spr_rot(sprite, x, y, custom_rotation, flip.x, flip.y);
    pal(9, 9);
    pal(10, 10);
}"""
          new = """void SilverKey::draw() {
    // Dedicated silver versions of the normal key's three atlas frames live
    // at sprite IDs 128..130. Keep using the normal key animation state
    // (8/9/10) and translate it to the matching silver artwork.
    uint8_t frame = sprite;
    if(frame < 8 || frame > 10) frame = 8;
    const uint8_t silver_sprite = static_cast<uint8_t>(128 + (frame - 8));
    spr_rot(silver_sprite, x, y, custom_rotation, flip.x, flip.y);
}"""
          if old not in s and new not in s:
              raise SystemExit("SilverKey::draw block not found")
          if old in s:
              classic.write_text(s.replace(old, new, 1))

          editor = Path("tools/calculator-editor/src/main.cpp")
          e = editor.read_text()
          old_draw = """void draw_sprite(uint8_t id, int x, int y, uint8_t rotation = 0) {
    if(id < 128 && atlas_tiles[id]) {
        rotation &= 3;
        if(!rotation) {
            gfx_TransparentSprite(atlas_tiles[id], x, y);
        } else {
            gfx_TempSprite(tmp, 8, 8);
            if(rotation == 1) gfx_RotateSpriteC(atlas_tiles[id], tmp);
            else if(rotation == 2) gfx_RotateSpriteHalf(atlas_tiles[id], tmp);
            else gfx_RotateSpriteCC(atlas_tiles[id], tmp);
            gfx_TransparentSprite(tmp, x, y);
        }
    } else {
        gfx_SetColor(tile_color(id));
        gfx_FillRectangle(x, y, 8, 8);
    }
}"""
          new_draw = """void draw_atlas_sprite(uint8_t sprite_id, int x, int y, uint8_t rotation = 0) {
    rotation &= 3;
    if(!rotation) {
        gfx_TransparentSprite(atlas_tiles[sprite_id], x, y);
    } else {
        gfx_TempSprite(tmp, 8, 8);
        if(rotation == 1) gfx_RotateSpriteC(atlas_tiles[sprite_id], tmp);
        else if(rotation == 2) gfx_RotateSpriteHalf(atlas_tiles[sprite_id], tmp);
        else gfx_RotateSpriteCC(atlas_tiles[sprite_id], tmp);
        gfx_TransparentSprite(tmp, x, y);
    }
}

void draw_sprite(uint8_t id, int x, int y, uint8_t rotation = 0) {
    if(id < 128 && atlas_tiles[id]) {
        draw_atlas_sprite(id, x, y, rotation);
    } else {
        gfx_SetColor(tile_color(id));
        gfx_FillRectangle(x, y, 8, 8);
    }
}"""
          if old_draw in e:
              e = e.replace(old_draw, new_draw, 1)
          elif new_draw not in e:
              raise SystemExit("draw_sprite block not found")

          old_key = """    if(id == 130) {
        gfx_SetColor(6);
        gfx_FillRectangle(x, y, 4, 4);
        gfx_FillRectangle(x + 3, y + 1, 5, 2);
        gfx_FillRectangle(x + 6, y + 3, 2, 2);
        gfx_SetColor(7);
        gfx_SetPixel(x + 1, y + 1);
        return;
    }"""
          new_key = """    if(id == 130) {
        // Use the dedicated silver-key texture instead of a gray placeholder.
        draw_atlas_sprite(128, x, y, rotation);
        return;
    }"""
          if old_key in e:
              e = e.replace(old_key, new_key, 1)
          elif new_key not in e:
              raise SystemExit("silver-key placeholder block not found")
          editor.write_text(e)
          PY
      - name: Clean temporary branch files and commit
        shell: bash
        run: |
          rm -f .github/workflows/temp-apply-silver-key-sprites.yml
          rm -f tools/.silver-key-sprite-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use dedicated silver key sprites"
            git push origin HEAD:fix/silver-key-sprites
          fi
